# Kamal 2 deploy for CertTrack: one Oracle Always Free Ampere A1 VM (2 OCPU / 12 GB, arm64,
# Ubuntu 24.04) running the app, kamal-proxy (automatic Let's Encrypt TLS) and Postgres 17.
# Runbook: docs/DEPLOY.md. Secrets are read from ENV by .kamal/secrets; nothing secret lives here.
#
# KAMAL_HOST is the VM's public IP. Export it before any kamal command; the fallback is a
# documentation-only address (TEST-NET-3) so `bin/kamal config` parses without it.
<% host = ENV.fetch("KAMAL_HOST", "203.0.113.10") %>

# Name of your application. Used to uniquely configure containers.
service: cert_track

# Kamal prefixes the registry server: ghcr.io/austenhughes1/cert_track.
image: austenhughes1/cert_track

servers:
  web:
    - <%= host %>

# kamal-proxy terminates TLS (Let's Encrypt) and routes certs.abaventures.net to the app.
# Requires config.assume_ssl and config.force_ssl in production.rb. Let's Encrypt needs ports
# 80 and 443 open and DNS pointing at the VM ("DNS only" if the zone is on Cloudflare).
proxy:
  ssl: true
  host: certs.abaventures.net
  # New containers only receive traffic once /up returns 200.
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

# GitHub Container Registry. KAMAL_REGISTRY_PASSWORD is a classic PAT with write:packages.
registry:
  server: ghcr.io
  username: austenhughes1
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    # Run the Solid Queue supervisor inside Puma: no separate job container on a single VM.
    SOLID_QUEUE_IN_PUMA: 1
    APP_HOST: certs.abaventures.net
    # The db accessory's container name on Kamal's docker network.
    DB_HOST: cert_track-db
    # Email goes out through the office's Google Workspace account (smtp.gmail.com, app password
    # in SMTP_PASSWORD). MAIL_FROM must be SMTP_USERNAME or one of its Gmail "Send mail as"
    # aliases; Gmail rewrites any other From address.
    SMTP_USERNAME: austen@abaventures.net
    MAIL_FROM: "CertTrack <austen@abaventures.net>"
    # App emails allowed per day (Notifications::SendBudget). Workspace allows about 2,000
    # recipients a day per account, and the owner's own mail from this account counts too.
    MAIL_DAILY_LIMIT: 1000
    # Reply-To on crew expiry notices, which ask crew to reply with their renewed certificate.
    # Must be a real, monitored inbox.
    OFFICE_EMAIL: austen@abaventures.net
    R2_BUCKET: certtrack-files
    R2_BACKUP_BUCKET: certtrack-backups
    # Nightly copy of every certificate file from R2 (Backups::FileCopyJob); the volume below.
    FILE_COPY_DIR: /rails/file_copies
    AI_PROVIDER: workers_ai
    AI_DAILY_NEURON_BUDGET: 9000
    AUTO_ACCEPT_ENABLED: "false"
    # Automatic issuer lookups (Phase 3b): only a certificate's verification code goes to its issuer's own site.
    VERIFICATION_AUTO_CHECKS: "true"
    # Sized for 2 OCPU (2 Ampere cores) / 12 GB: one Puma worker per core (3 threads each, see
    # config/puma.rb). JOB_CONCURRENCY is processes per Solid Queue worker (config/queue.yml): one
    # for imports (2 threads) and one for everything else (2 threads), so an import backlog never
    # holds up backups or email. Import jobs shell out to tesseract/pdftoppm and are CPU-bound, so
    # raising it would starve web.
    WEB_CONCURRENCY: 2
    JOB_CONCURRENCY: 1
    # Chosen by the accuracy test on the owner's samples (docs/PLAN.md, Phase 3, Nov 2026).
    AI_PROVIDER: anthropic
    ANTHROPIC_MODEL: claude-opus-5-5
    # Only with AI_PROVIDER=workers_ai, the free option the accuracy test scored lower:
    # EXTRACTION_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    # EXTRACTION_VISION_MODEL: "@cf/meta/llama-4-scout-17b-16e-instruct"
    # The app's own ceiling on paid tokens per UTC day (default 2000000, about $10 at Opus's rates).
    AI_DAILY_TOKEN_BUDGET: "2000000"
    # CHAT_MODEL: "@cf/..."
    # Only with AI_PROVIDER=ollama (default http://localhost:11434/v1).
    # OLLAMA_URL: "http://localhost:11434/v1"
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - SMTP_PASSWORD
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_AI_API_TOKEN
    # Optional paid fallback (AI_PROVIDER=anthropic). Uncomment here AND in .kamal/secrets.
    - ANTHROPIC_API_KEY

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Uploads live in R2 and the database in the accessory's directory below. This volume holds the
# nightly copy of the certificate files on the VM's own disk (docs/DEPLOY.md, "File copies").
# The host directory must exist and be owned by uid 1000 (the image's rails user) before deploy.
volumes:
  - "/var/lib/certtrack/file-copies:/rails/file_copies"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# First boot runs db:prepare (creates and loads 4 databases) before /up answers; allow for it.
deploy_timeout: 90

# The VM is arm64 and the dev machine is x86_64, so build natively on the VM over SSH instead of
# under QEMU emulation. local: false always uses the VM builder (the local docker CLI with buildx
# drives it over SSH); the VM's docker, logged in to GHCR by Kamal, pushes the image.
builder:
  arch: arm64
  remote: ssh://ubuntu@<%= host %>
  local: false

# Oracle's Ubuntu images log in as "ubuntu" (passwordless sudo, so kamal setup can install Docker).
ssh:
  user: ubuntu

# Postgres 17 on the same VM. Port 5432 is bound to the VM's loopback only; the app reaches it as
# cert_track-db over Kamal's docker network. POSTGRES_USER is a superuser, so the app's
# db:prepare can create the _cache, _queue and _cable databases itself.
accessories:
  db:
    image: postgres:17
    host: <%= host %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: cert_track
        POSTGRES_DB: cert_track_production
      secret:
        - POSTGRES_PASSWORD
    # Persists to ~/cert_track-db/data on the VM. Nightly pg_dump backups go to R2 (docs/DEPLOY.md).
    directories:
      - data:/var/lib/postgresql/data
