production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  nightly_database_backup:
    class: Backups::DatabaseJob
    schedule: "0 3 * * * America/Denver"
  daily_expiry_scan:
    class: Notifications::ExpiryScanJob
    schedule: "0 6 * * * America/Denver"
  weekly_expiry_digest:
    class: Notifications::WeeklyDigestJob
    schedule: "0 6 * * 1 America/Denver"
  purge_unattached_blobs:
    class: Maintenance::PurgeUnattachedBlobsJob
    schedule: "30 3 * * * America/Denver"
  purge_import_extractions:
    class: Maintenance::PurgeImportExtractionsJob
    schedule: "45 3 * * * America/Denver"
  purge_old_packets:
    class: Maintenance::PurgeOldPacketsJob
    schedule: "50 3 * * * America/Denver"
  nightly_file_copy:
    class: Backups::FileCopyJob
    schedule: "15 4 * * * America/Denver"
