test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 through the S3 API (production). The bucket stays private: files are served
# through Rails with presigned URLs that expire in 5 minutes (config/initializers/active_storage.rb).
r2:
  service: S3
  endpoint: https://<%= ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  region: auto
  bucket: <%= ENV.fetch("R2_BUCKET", "certtrack-files") %>
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  # aws-sdk-s3 >= 1.178 adds CRC checksums to every request by default, which R2 can reject.
  # Only send/validate checksums when the S3 operation requires them.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
