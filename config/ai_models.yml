# Per-model settings for AI extraction (read by Ai::Config, used by Ai::Budget and Ai::Client).
#
# Neuron rates are Cloudflare Workers AI's published rates, in neurons per million tokens,
# copied from https://developers.cloudflare.com/workers-ai/platform/pricing/ on Nov 3, 2026 and
# re-checked Nov 4, 2026 (page dated Oct 20, 2026)
# (1,000 neurons = $0.011; 10,000 neurons/day are free and reset at 00:00 UTC). Re-check that
# page when you change EXTRACTION_MODEL, and add the model here if it is missing: unknown
# models fall back to the deliberately high "default" rates so the budget errs on the safe side.
#
# Keys per model:
#   input_per_million, output_per_million  neurons per million input / output tokens
#   per_image          extra neurons added per attached page image. Cloudflare bills image
#                      tokens as input tokens. Where a Nov 4, 2026 probe showed the reported
#                      input tokens already include the image, this is 0; elsewhere it is a
#                      conservative VERIFY estimate on top
#   structured_output  true when the model supports JSON Mode (response_format json_schema,
#                      https://developers.cloudflare.com/workers-ai/features/json-mode/),
#                      checked with a real request through the OpenAI-compatible endpoint.
#                      false sends "reply with JSON only" instead and parses the reply
#   vision             true when the model accepts images (EXTRACTION_VISION_MODEL candidates)
#   max_images         most images one request may carry; pages beyond it go in more calls
#
# Anthropic and Ollama are not billed in neurons: their usage is recorded as plain tokens and
# the daily neuron budget does not apply to them (see Ai::Budget).

default:
  input_per_million: 35000
  output_per_million: 210000
  per_image: 100
  structured_output: false
  vision: false
  max_images: 1

models:
  # --- Text extraction candidates (EXTRACTION_MODEL) ---
  "@cf/meta/llama-3.3-70b-instruct-fp8-fast":
    input_per_million: 26668
    output_per_million: 204805
    structured_output: true
  "@cf/meta/llama-3.1-8b-instruct-fp8-fast":
    input_per_million: 4119
    output_per_million: 34868
    structured_output: true
  "@cf/meta/llama-3.1-8b-instruct":
    input_per_million: 25608
    output_per_million: 75147
    structured_output: true
  # Mistral Small 3.1, Gemma 4 and Llama 4 Scout also read images (vision candidates too).
  "@cf/mistralai/mistral-small-3.1-24b-instruct":
    input_per_million: 31876
    output_per_million: 50488
    per_image: 0
    structured_output: true
    vision: true
  # A reasoning model: it spends a few hundred output tokens thinking before it answers.
  "@cf/google/gemma-4-26b-a4b-it":
    input_per_million: 9091
    output_per_million: 27273
    per_image: 0
    structured_output: true
    vision: true
  # Not candidates (Nov 4, 2026): @cf/google/gemma-3-12b-it is no longer offered to this account;
  # @cf/qwen/qwen3-30b-a3b-fp8 thinks until it runs out of output tokens and never answers;
  # @cf/meta/llama-3.1-8b-instruct-fp8 (not -fast) refuses JSON schemas.

  # --- Vision candidates (EXTRACTION_VISION_MODEL) ---
  # Not usable as of Nov 4, 2026: Workers AI answers HTTP 400 "Internal Server Error" to every
  # image sent through the OpenAI-compatible endpoint the app uses (text-only requests work).
  # Meta's license, accepted on this account Nov 4, is needed before any request.
  "@cf/meta/llama-3.2-11b-vision-instruct":
    input_per_million: 4410
    output_per_million: 61493
    per_image: 30 # VERIFY: about 6,400 image tokens at the input rate
    vision: true
    max_images: 1
  "@cf/meta/llama-4-scout-17b-16e-instruct":
    input_per_million: 24545
    output_per_million: 77273
    per_image: 0
    structured_output: true
    vision: true
    max_images: 4 # VERIFY against the model card before raising

  # --- Anthropic fallback (AI_PROVIDER=anthropic). Rates are not neurons: usage is tokens. ---
  "claude-haiku-5-5":
    input_per_million: 0
    output_per_million: 0
    structured_output: true
    vision: true
    max_images: 20
  "claude-sonnet-5-5":
    input_per_million: 0
    output_per_million: 0
    structured_output: true
    vision: true
    max_images: 20
  "claude-opus-5-5":
    input_per_million: 0
    output_per_million: 0
    structured_output: true
    vision: true
    max_images: 20

  # --- Ai::FakeProvider (AI_PROVIDER=fake; the default in tests). Cheap, so a whole test
  # batch fits in the budget while the budget code still runs. ---
  "fake-extractor":
    input_per_million: 4000
    output_per_million: 35000
    structured_output: true
  "fake-vision":
    input_per_million: 4000
    output_per_million: 35000
    per_image: 30
    structured_output: true
    vision: true
    max_images: 2
