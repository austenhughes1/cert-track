# Two kinds of worker, so an import backlog can never hold up the rest (docs/DEPLOY.md, section 10):
#   - default (plus Solid Queue's own recurring commands): backups, expiry scans and digests, all
#     mail, maintenance, Active Storage analysis and purges, packets. It never runs an import job.
#   - imports: the Imports::* pipeline, and Certificates::ShrinkFilesJob, Certificates::ReadQrCodesJob
#     and Verification::CheckJob (also CPU work: they shrink new photos and scans, and read QR codes).
#     OCR (tesseract, pdftoppm) is CPU-bound, so two threads keep at most two files in OCR on the
#     2-core VM (one is often just waiting for the AI).
# JOB_CONCURRENCY is processes per worker (config/deploy.yml). A job on a queue no worker lists
# would never run: test/config/queue_config_test.rb checks every job class against this file.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ default, solid_queue_recurring ]
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: [ imports ]
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
